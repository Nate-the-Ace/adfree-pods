<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adfree Pods</title>
  <style>
    :root { --bg:#fff; --fg:#1b1b1f; --mute:#6b6b76; --line:#e2e2e8; --ok:#1a7f37; --bad:#b42318; --unk:#6b6b76; --card:#f6f6f9; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#16161a; --fg:#ececf1; --mute:#9a9aa6; --line:#2c2c34; --ok:#4ade80; --bad:#f87171; --unk:#9a9aa6; --card:#1f1f25; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui, sans-serif; }
    main { max-width:760px; margin:0 auto; padding:16px 16px 140px; }
    h1 { font-size:1.3rem; margin:8px 0 16px; }
    form { display:flex; gap:8px; margin-bottom:16px; }
    input[type=url] { flex:1; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); min-width:0; }
    button { padding:10px 14px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); cursor:pointer; }
    select { padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); width:100%; margin-bottom:12px; }
    ul { list-style:none; margin:0; padding:0; }
    li { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); }
    li .t { flex:1; min-width:0; }
    li .t b { display:block; overflow:hidden; text-overflow:ellipsis; }
    li small { color:var(--mute); }
    .badge { font-size:.75rem; padding:2px 8px; border-radius:99px; border:1px solid currentColor; white-space:nowrap; }
    .clean { color:var(--ok); } .suspected { color:var(--bad); } .unknown { color:var(--unk); }
    footer { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:10px 16px; }
    footer .in { max-width:760px; margin:0 auto; }
    audio { width:100%; }
    h1 small { font-size:.8rem; color:var(--mute); font-weight:400; }
    h1 button { font-size:.75rem; padding:4px 8px; float:right; }
    h2 { font-size:1rem; margin:16px 0 4px; }
    .bar { height:4px; background:var(--line); border-radius:2px; margin-top:6px; }
    .bar i { display:block; height:100%; background:var(--ok); border-radius:2px; }
    li.done .t b { color:var(--mute); }
    #login[hidden] { display:none; }
    #login { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:10; }
    #loginForm { flex-direction:column; width:min(340px, 90vw); align-items:stretch; }
    #loginForm input { padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
    #loginMsg { color:var(--bad); min-height:1.2em; }
    #msg { color:var(--bad); min-height:1.2em; }
  </style>
</head>
<body>
<div id="login" hidden>
  <form id="loginForm">
    <h2 id="loginTitle">Sign in</h2>
    <input id="user" autocomplete="username" placeholder="Username" required>
    <input id="pass" type="password" autocomplete="current-password" placeholder="Password (8+ characters)" required>
    <input id="invite" type="password" placeholder="Invite code" hidden>
    <button>Sign in</button>
    <a href="#" id="toggle">Create an account</a>
    <div id="loginMsg" role="status"></div>
  </form>
</div>
<main>
  <h1>Adfree Pods <small id="who"></small> <button id="logout" hidden>Sign out</button></h1>
  <div id="msg" role="status"></div>
  <section id="resume" hidden>
    <h2>Continue listening</h2>
    <ul id="resumeList"></ul>
  </section>
  <select id="feeds" aria-label="Feed"></select>
  <ul id="eps"></ul>
</main>
<footer>
  <div class="in">
    <div id="now"><small>Nothing playing</small></div>
    <audio id="player" controls preload="metadata"></audio>
  </div>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
